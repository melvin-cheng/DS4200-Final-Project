<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    #vis.vega-embed {
      width: 100%;
      display: flex;
    }

    #vis.vega-embed details,
    #vis.vega-embed details summary {
      position: relative;
    }
  </style>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega-lite@5.20.1"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
</head>
<body>
  <div id="vis"></div>
  <script>
    (function(vegaEmbed) {
      var spec = {"config": {"view": {"continuousWidth": 300, "continuousHeight": 300}}, "hconcat": [{"data": {"url": "pizza_data.csv"}, "mark": {"type": "circle", "opacity": 0.6, "size": 60}, "encoding": {"color": {"field": "pizza_category", "legend": null, "title": "Category", "type": "nominal"}, "tooltip": [{"field": "pizza_name", "type": "nominal"}, {"field": "pizza_size", "type": "nominal"}, {"field": "pizza_category", "type": "nominal"}, {"field": "unit_price", "type": "quantitative"}, {"field": "total_price", "type": "quantitative"}], "x": {"field": "unit_price", "title": "Unit Price ($)", "type": "quantitative"}, "y": {"field": "pizza_category", "title": "Category", "type": "nominal"}}, "height": 300, "name": "view_3", "title": "Unit Price by Pizza Category", "width": 300}, {"data": {"url": "pizza_ingredients_data.csv"}, "mark": {"type": "bar", "color": "#e8c827"}, "encoding": {"tooltip": [{"field": "ingredient", "title": "Ingredient", "type": "nominal"}, {"field": "total_quantity", "title": "Qty Ordered", "type": "quantitative"}], "x": {"field": "total_quantity", "title": "Total Pizzas Sold", "type": "quantitative"}, "y": {"field": "ingredient", "sort": "-x", "title": "Ingredient", "type": "nominal"}}, "height": 300, "title": "Top 5 Ingredients", "transform": [{"filter": {"param": "param_3"}}, {"aggregate": [{"op": "sum", "field": "quantity", "as": "total_quantity"}], "groupby": ["ingredient"]}, {"window": [{"op": "rank", "field": "total_quantity", "as": "rank"}], "sort": [{"field": "total_quantity", "order": "descending"}]}, {"filter": "datum.rank <= 5"}], "width": 300}], "params": [{"name": "param_3", "select": {"type": "interval", "encodings": ["x"]}, "views": ["view_3"]}], "$schema": "https://vega.github.io/schema/vega-lite/v5.20.1.json"};
      var embedOpt = {"mode": "vega-lite"};

      function showError(el, error){
          el.innerHTML = ('<div style="color:red;">'
                          + '<p>JavaScript Error: ' + error.message + '</p>'
                          + "<p>This usually means there's a typo in your chart specification. "
                          + "See the javascript console for the full traceback.</p>"
                          + '</div>');
          throw error;
      }
      const el = document.getElementById('vis');
      vegaEmbed("#vis", spec, embedOpt)
        .catch(error => showError(el, error));
    })(vegaEmbed);

  </script>
</body>
</html>
